name: Process OSM CSV Chunk

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Chunk number to process (01–63)'
        required: true
        default: '01'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install osmium shapely rtree psycopg2-binary geopy

      - name: Cache Vietnam OSM PBF
        id: cache-pbf
        uses: actions/cache@v3
        with:
          path: vietnam-latest.osm.pbf
          key: osm-pbf-${{ runner.os }}-v1
          restore-keys: |
            osm-pbf-${{ runner.os }}-

      - name: Download PBF if missing
        if: steps.cache-pbf.outputs.cache-hit != 'true'
        run: |
          curl -SL -o vietnam-latest.osm.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf

      - name: Process chunk ${{ github.event.inputs.part }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          INPUT="vietnam_part_${{ github.event.inputs.part }}.csv"
          python process_osm.py \
            --osm-pbf vietnam-latest.osm.pbf \
            --input-csv "csv_chunks/$INPUT" \
            --db-url "$DATABASE_URL"

  trigger_next:
    needs: process
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.part != '63' && success() }}
    steps:
      - name: Trigger next chunk
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const next = String(parseInt(inputs.part) + 1).padStart(2, '0');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              ref: context.ref.replace('refs/heads/', ''),
              inputs: { part: next }
            });
